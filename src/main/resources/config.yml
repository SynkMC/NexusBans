alert-on-attempt: true #Alert player with the nexusbans.alert permission if, for example, a muted player tries to chat
ban-all-ips: true #When using ipban or ipmute on a player and not a specific IP, whether to ban all the IPs this player has used in the past or only their current one
messages:
  prefix: "<dark_gray>[<gradient:#FFAA00:#940000>NexusBans</gradient><dark_gray>] » <reset>"
  temp-punish-usage: "<red>Usage: /%s1% [target] [duration] (reason)"
  punish-usage: "<red>Usage: /%s1% [target] (reason)"
  punishment-success: "<green>%s1% %s2% <dark_green>%s3%"
  temp-punishment-success: "<green>%s1% %s2% <dark_green>%s3% <green>for %s4%"
  punished-notify: "<red>You have been %s1%!"
  temp-punished-notify: "<red>You have been %s1% <dark_red>for %s2%<red>!"
  muted: "<red>You are currently muted!"
  tempmuted: "<red>You are currently muted for <dark_red>%s1%<red>!"
  alert-mute: "<dark_red>%s1% <red>tried to chat while they were muted!"
  banned: "<red>You are currently banned from the server!"
  banned-reason: "<red>You are currently banned for the reason <dark_red>%s1%<red>!"
  ipbanned: "<red>You are currently IP banned from the server!"
  ipbanned-reason: "<red>You are currently IP banned for the reason <dark_red>%s1%<red>!"
  alert-ban: "<dark_red>%s1% <red>tried to join the server while they were banned!"
  kicked: "<red>You were kicked from the server!"
  kicked-reason: "<red>You were kicked from the server for <dark_red>%s1%<red>!"
  un-usage: "<red>Usage: /un%s1% <username/ip>"
  not-punished: "<dark_red>%s1% <red>wasn't %s2%!"
  unpunished: "<dark_red>%s1% <red>was un%s2%!"
  unpunished-notify: "<green>You were un%s1%!"
